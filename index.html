<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vamos Cultura 🪀 | Productora Audiovisual & Arte Urbano</title>
  <style>
    /* ==========================================================================
       1. PALETA EDITORIAL & COLLAGE CULTURAL (Inspirada en la referencia visual)
       ========================================================================== */
    :root {
      --morado-base: #33204F;
      --morado-oscuro: #180d29;
      --morado-tarjeta: #26163d;
      --morado-borde: #51357a;
      --dorado-halo: #F5C542;
      --dorado-hover: #ffd45c;
      --rojo-collage: #E63926;
      --azul-cobalto: #2B6CB0;
      --crema-papel: #F7F2E7;
      --whatsapp-verde: #25D366;
      --whatsapp-hover: #1ebe5d;
      --texto-claro: #FAF7FF;
      --texto-suave: #CBBEE0;
      --sombra-collage: 0 20px 45px rgba(0, 0, 0, 0.55);
    }

    /* ==========================================================================
       2. RESET, TEXTURA DE GRANO Y FONDO GEOMÉTRICO ARTÍSTICO
       ========================================================================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--morado-oscuro);
      background-image:
        radial-gradient(circle at 85% 12%, rgba(245, 197, 66, 0.22) 0%, transparent 28%),
        radial-gradient(circle at 12% 25%, rgba(230, 57, 38, 0.22) 0%, transparent 32%),
        radial-gradient(circle at 80% 82%, rgba(43, 108, 176, 0.25) 0%, transparent 35%),
        linear-gradient(160deg, var(--morado-base) 0%, #23133b 50%, var(--morado-oscuro) 100%);
      color: var(--texto-claro);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      line-height: 1.5;
      overflow-x: hidden;
      position: relative;
    }

    /* Bloques geométricos tipo collage artístico en el fondo (CSS puro) */
    .collage-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .collage-halo {
      position: absolute;
      top: -45px;
      right: -35px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 197, 66, 0.32) 0%, rgba(245, 197, 66, 0.05) 70%);
      border: 2px dashed rgba(245, 197, 66, 0.35);
    }

    .collage-franja-roja {
      position: absolute;
      top: 18%;
      left: -30px;
      width: 95px;
      height: 220px;
      background: linear-gradient(180deg, rgba(230, 57, 38, 0.24), rgba(245, 197, 66, 0.14));
      transform: rotate(-12deg);
      border-right: 3px solid rgba(245, 197, 66, 0.35);
    }

    .collage-mosaico {
      position: absolute;
      bottom: 8%;
      right: 12px;
      display: grid;
      grid-template-columns: repeat(3, 16px);
      gap: 4px;
      opacity: 0.32;
    }

    .collage-mosaico span:nth-child(1) { background: var(--rojo-collage); height: 16px; }
    .collage-mosaico span:nth-child(2) { background: var(--dorado-halo); height: 16px; }
    .collage-mosaico span:nth-child(3) { background: transparent; height: 16px; }
    .collage-mosaico span:nth-child(4) { background: var(--azul-cobalto); height: 16px; }
    .collage-mosaico span:nth-child(5) { background: var(--crema-papel); height: 16px; }
    .collage-mosaico span:nth-child(6) { background: var(--rojo-collage); height: 16px; }

    header, .progreso-contenedor, main, footer {
      position: relative;
      z-index: 1;
    }

    /* ==========================================================================
       3. CABECERA CON HALO DORADO Y ESTÉTICA DE CINE & ARTE URBANO
       ========================================================================== */
    header {
      padding: 24px 20px 10px;
      text-align: center;
      max-width: 580px;
      width: 100%;
      margin: 0 auto;
    }

    .badge-rec {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(24, 13, 41, 0.78);
      border: 1.5px solid var(--dorado-halo);
      color: var(--dorado-halo);
      padding: 5px 14px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      margin-bottom: 12px;
      box-shadow: 3px 3px 0px var(--rojo-collage);
    }

    .punto-rec {
      width: 8px;
      height: 8px;
      background-color: var(--rojo-collage);
      border-radius: 50%;
      animation: parpadeo 1.3s infinite ease-in-out;
    }

    @keyframes parpadeo {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.25; transform: scale(0.8); }
    }

    .marca-titulo-wrap {
      display: inline-block;
      position: relative;
      padding: 4px 12px;
    }

    /* Halo dorado detrás del título inspirando la estética artística */
    .marca-titulo-wrap::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 197, 66, 0.42) 0%, rgba(245, 197, 66, 0) 72%);
      z-index: -1;
    }

    header h1 {
      font-size: 1.9rem;
      font-weight: 900;
      letter-spacing: -0.6px;
      color: #ffffff;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.45);
    }

    header h1 span {
      color: var(--dorado-halo);
    }

    .eslogan {
      font-size: 0.92rem;
      color: var(--crema-papel);
      margin-top: 4px;
      font-style: italic;
      opacity: 0.9;
    }

    /* ==========================================================================
       4. BARRA DE PROGRESO MULTICOLOR (Collage Ribbon)
       ========================================================================== */
    .progreso-contenedor {
      max-width: 580px;
      width: 100%;
      margin: 12px auto 0;
      padding: 0 20px;
    }

    .progreso-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--dorado-halo);
      margin-bottom: 6px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .barra-fondo {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .barra-relleno {
      height: 100%;
      width: 16.6%;
      background: linear-gradient(90deg, var(--rojo-collage) 0%, var(--dorado-halo) 55%, #38bdf8 100%);
      transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ==========================================================================
       5. TARJETA PRINCIPAL DE ESCENA (Estilo Recorte Editorial & Visor)
       ========================================================================== */
    main {
      max-width: 580px;
      width: 100%;
      margin: 18px auto;
      padding: 0 18px;
      flex: 1;
      display: flex;
      align-items: center;
    }

    .escena-card {
      width: 100%;
      background: linear-gradient(165deg, rgba(44, 26, 71, 0.96) 0%, rgba(28, 15, 48, 0.98) 100%);
      border: 2px solid var(--morado-borde);
      border-radius: 18px;
      padding: 26px 22px;
      box-shadow: var(--sombra-collage), 6px 6px 0px rgba(245, 197, 66, 0.25);
      position: relative;
      animation: entrarEscena 0.38s ease forwards;
    }

    /* Cinta decorativa superior tipo cinta adhesiva de estudio / collage */
    .cinta-estudio {
      position: absolute;
      top: -11px;
      left: 50%;
      transform: translateX(-50%) rotate(-1.5deg);
      background: var(--dorado-halo);
      color: var(--morado-oscuro);
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 1.5px;
      padding: 2px 14px;
      text-transform: uppercase;
      border-radius: 3px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    }

    @keyframes entrarEscena {
      from { opacity: 0; transform: translateY(14px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .paso-etiqueta {
      color: var(--dorado-halo);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 6px;
      display: block;
    }

    .pregunta-titulo {
      font-size: 1.35rem;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .pregunta-subtitulo {
      font-size: 0.88rem;
      color: var(--texto-suave);
      margin-bottom: 18px;
    }

    /* ==========================================================================
       6. OPCIONES INTERACTIVAS Y SELECCIÓN MÚLTIPLE DE SERVICIOS
       ========================================================================== */
    .grid-opciones {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .opcion-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid var(--morado-borde);
      border-radius: 14px;
      padding: 14px 15px;
      text-align: left;
      color: var(--texto-claro);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 13px;
      width: 100%;
      position: relative;
    }

    .opcion-btn:hover {
      border-color: rgba(245, 197, 66, 0.7);
      background: rgba(245, 197, 66, 0.08);
      transform: translateX(2px);
    }

    .opcion-btn.activa {
      border-color: var(--dorado-halo);
      background: linear-gradient(135deg, rgba(245, 197, 66, 0.2), rgba(230, 57, 38, 0.12));
      box-shadow: 4px 4px 0px var(--dorado-halo);
    }

    .opcion-icono {
      font-size: 1.55rem;
      line-height: 1;
      margin-top: 2px;
    }

    .opcion-contenido {
      flex: 1;
    }

    .opcion-titulo {
      font-weight: 800;
      font-size: 0.97rem;
      display: block;
      color: #ffffff;
    }

    .opcion-desc {
      font-size: 0.81rem;
      color: var(--texto-suave);
      display: block;
      margin-top: 3px;
    }

    .opcion-pie {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      gap: 8px;
    }

    .opcion-precio {
      display: inline-block;
      background: rgba(245, 197, 66, 0.22);
      color: var(--dorado-halo);
      font-weight: 800;
      font-size: 0.85rem;
      padding: 3px 10px;
      border-radius: 6px;
      border: 1px solid rgba(245, 197, 66, 0.4);
    }

    .check-pill {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--texto-suave);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .opcion-btn.activa .check-pill {
      background: var(--dorado-halo);
      color: var(--morado-oscuro);
      border-color: var(--dorado-halo);
    }

    /* Barra flotante de subtotal acumulado en la escena de servicios */
    .barra-subtotal-servicios {
      margin-top: 16px;
      background: rgba(24, 13, 41, 0.85);
      border: 1.5px solid var(--dorado-halo);
      border-radius: 12px;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .subtotal-texto {
      font-size: 0.82rem;
      color: var(--crema-papel);
    }

    .subtotal-texto strong {
      color: var(--dorado-halo);
      display: block;
      font-size: 0.9rem;
    }

    .subtotal-monto {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--dorado-halo);
    }

    /* ==========================================================================
       7. CAMPOS DE TEXTO Y CHIPS DE INSPIRACIÓN
       ========================================================================== */
    .campo-input,
    .campo-textarea {
      width: 100%;
      background: rgba(18, 9, 32, 0.78);
      border: 2px solid var(--morado-borde);
      border-radius: 14px;
      padding: 14px 16px;
      color: #ffffff;
      font-size: 0.96rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .campo-input::placeholder,
    .campo-textarea::placeholder {
      color: #9382ad;
    }

    .campo-input:focus,
    .campo-textarea:focus {
      border-color: var(--dorado-halo);
    }

    .campo-textarea {
      min-height: 115px;
      resize: vertical;
    }

    .chips-sugerencias {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--morado-borde);
      color: var(--crema-papel);
      font-size: 0.78rem;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip:hover {
      border-color: var(--dorado-halo);
      background: rgba(245, 197, 66, 0.16);
      color: var(--dorado-halo);
    }

    /* ==========================================================================
       8. RESUMEN FINAL DE PRODUCCIÓN Y COTIZACIÓN
       ========================================================================== */
    .ficha-resumen {
      background: rgba(18, 9, 32, 0.78);
      border: 1.5px solid var(--morado-borde);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .ficha-fila {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 9px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.14);
      font-size: 0.87rem;
    }

    .ficha-fila:last-child {
      border-bottom: none;
    }

    .ficha-clave {
      color: var(--texto-suave);
      font-weight: 600;
      min-width: 105px;
    }

    .ficha-valor {
      color: #ffffff;
      font-weight: 700;
      text-align: right;
      word-break: break-word;
    }

    .lista-servicios-resumen {
      list-style: none;
      text-align: right;
    }

    .lista-servicios-resumen li {
      margin-bottom: 5px;
      line-height: 1.35;
    }

    .lista-servicios-resumen li span.tag-precio {
      color: var(--dorado-halo);
      font-weight: 800;
      font-size: 0.82rem;
      display: block;
    }

    .caja-total {
      background: linear-gradient(135deg, rgba(230, 57, 38, 0.22), rgba(245, 197, 66, 0.22));
      border: 2px solid var(--dorado-halo);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      box-shadow: 4px 4px 0px rgba(230, 57, 38, 0.45);
    }

    .caja-total-label {
      font-size: 0.92rem;
      font-weight: 800;
      color: #ffffff;
    }

    .caja-total-sub {
      display: block;
      font-size: 0.75rem;
      color: var(--crema-papel);
      font-weight: 400;
    }

    .caja-total-precio {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--dorado-halo);
    }

    /* ==========================================================================
       9. BOTONES DE NAVEGACIÓN Y WHATSAPP
       ========================================================================== */
    .navegacion-botones {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-secundario {
      background: transparent;
      border: 1.5px solid var(--morado-borde);
      color: var(--texto-suave);
      padding: 14px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secundario:hover {
      border-color: #ffffff;
      color: #ffffff;
    }

    .btn-principal {
      flex: 1;
      background: var(--dorado-halo);
      color: var(--morado-oscuro);
      border: none;
      padding: 14px 20px;
      border-radius: 12px;
      font-weight: 900;
      font-size: 0.98rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 4px 4px 0px var(--rojo-collage);
    }

    .btn-principal:hover {
      background: var(--dorado-hover);
      transform: translate(-1px, -1px);
    }

    .btn-principal:disabled {
      opacity: 0.38;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-whatsapp {
      width: 100%;
      background: var(--whatsapp-verde);
      color: #072410;
      border: 2px solid #ffffff;
      padding: 16px 20px;
      border-radius: 14px;
      font-weight: 900;
      font-size: 1.03rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 24px rgba(37, 211, 102, 0.38);
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-whatsapp:hover {
      background: var(--whatsapp-hover);
      transform: translateY(-2px);
    }

    .nota-privacidad {
      text-align: center;
      font-size: 0.76rem;
      color: var(--texto-suave);
      margin-top: 12px;
    }

    /* ==========================================================================
       10. PIE DE PÁGINA OBLIGATORIO
       ========================================================================== */
    footer {
      text-align: center;
      padding: 18px 16px 24px;
      font-size: 0.8rem;
      color: var(--texto-suave);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <!-- ELEMENTOS VISUALES DE COLLAGE ARTÍSTICO EN EL FONDO -->
  <div class="collage-bg" aria-hidden="true">
    <div class="collage-halo"></div>
    <div class="collage-franja-roja"></div>
    <div class="collage-mosaico">
      <span></span><span></span><span></span>
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- CABECERA DE LA PRODUCTORA -->
  <header>
    <div class="badge-rec">
      <span class="punto-rec"></span>
      <span>REC · Barrancabermeja, Santander</span>
    </div>
    <div class="marca-titulo-wrap">
      <h1>Vamos <span>Cultura</span> 🪀</h1>
    </div>
    <p class="eslogan">«La cultura nos une, las ideas nos mueven.»</p>
  </header>

  <!-- INDICADOR DE PROGRESO -->
  <div class="progreso-contenedor">
    <div class="progreso-info">
      <span id="texto-paso">Escena 1 de 6</span>
      <span id="porcentaje-paso">17%</span>
    </div>
    <div class="barra-fondo">
      <div class="barra-relleno" id="barra-relleno"></div>
    </div>
  </div>

  <!-- ESCENARIO PRINCIPAL DEL CUESTIONARIO -->
  <main id="contenedor-cuestionario">
    <!-- Las escenas se renderizan dinámicamente aquí -->
  </main>

  <!-- PIE DE PÁGINA INSTITUCIONAL -->
  <footer>
    Proyecto académico · Creación de Empresas · UNIPAZ 2026
  </footer>

  <script>
    /* ==========================================================================
       1. CONFIGURACIÓN DE VAMOS CULTURA (WhatsApp oficial +57 310 434 4957)
       ========================================================================== */
    const EMPRESA = {
      nombre: "Vamos Cultura",
      ciudad: "Barrancabermeja, Santander",
      whatsappNumero: "573104344957"
    };

    const SERVICIOS_CATALOGO = [
      {
        id: "sesion-foto",
        icono: "📸",
        titulo: "Sesión Fotográfica Artística o Comercial",
        descripcion: "Retratos, book para artistas, cobertura fotográfica o catálogo de marca con edición profesional.",
        precio: 600000
      },
      {
        id: "video-pub",
        icono: "🎬",
        titulo: "Video Publicitario o Videoclip",
        descripcion: "Guion creativo, grabación en locaciones de Barrancabermeja, edición dinámica y colorización.",
        precio: 1300000
      },
      {
        id: "prod-integral",
        icono: "🎥",
        titulo: "Producción Audiovisual y Cobertura Integral",
        descripcion: "Fotografía, grabación multicámara, edición de videos y creación de contenido audiovisual completo para eventos.",
        precio: 3200000
      },
      {
        id: "evento-cultural",
        icono: "🎭",
        titulo: "Organización y Producción de Eventos Culturales",
        descripcion: "Planeación, coordinación y producción de festivales, ferias, encuentros artísticos y actividades comunitarias.",
        precio: 900000
      }
    ];

    /* ==========================================================================
       2. ESTADO TEMPORAL EN MEMORIA (Soporta múltiples servicios seleccionados)
       ========================================================================== */
    let pasoActual = 0;

    const respuestas = {
      perfil: "",
      serviciosSeleccionados: [], // Array de IDs para permitir seleccionar 1 o varios servicios
      objetivo: "",
      inspiracion: "",
      nombreContacto: ""
    };

    /* ==========================================================================
       3. UTILIDADES DE CÁLCULO Y FORMATO COP ($ 1.500.000)
       ========================================================================== */
    function formatearCOP(valor) {
      const numero = new Intl.NumberFormat("es-CO", {
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(valor);
      return `$ ${numero}`;
    }

    function obtenerObjetosServiciosSeleccionados() {
      return SERVICIOS_CATALOGO.filter(s => respuestas.serviciosSeleccionados.includes(s.id));
    }

    function calcularTotalCotizacion() {
      return obtenerObjetosServiciosSeleccionados().reduce((acum, item) => acum + item.precio, 0);
    }

    /* ==========================================================================
       4. RENDERIZADO DE LAS 6 ESCENAS DEL CUESTIONARIO
       ========================================================================== */
    const totalPasos = 6;

    function actualizarProgreso() {
      const numeroEscena = pasoActual + 1;
      const porcentaje = Math.round((numeroEscena / totalPasos) * 100);
      document.getElementById("texto-paso").textContent =
        pasoActual === totalPasos - 1
          ? "Guion listo · Resumen creativo"
          : `Escena ${numeroEscena} de ${totalPasos}`;
      document.getElementById("porcentaje-paso").textContent = `${porcentaje}%`;
      document.getElementById("barra-relleno").style.width = `${porcentaje}%`;
    }

    function renderizarEscena() {
      actualizarProgreso();
      const contenedor = document.getElementById("contenedor-cuestionario");

      // ESCENA 1: PERFIL DEL CLIENTE
      if (pasoActual === 0) {
        const perfiles = [
          {
            icono: "🎤",
            titulo: "Artista, Músico o Colectivo Cultural",
            desc: "Quiero proyectar mi arte, lanzar un proyecto o documentar una presentación."
          },
          {
            icono: "🚀",
            titulo: "Emprendimiento o Empresa",
            desc: "Busco piezas audiovisuales con identidad cultural para posicionar mi marca."
          },
          {
            icono: "🤝",
            titulo: "Organización Social, Institución o Comunidad",
            desc: "Queremos realizar un evento cultural, festival o memoria audiovisual comunitaria."
          }
        ];

        contenedor.innerHTML = `
          <section class="escena-card">
            <span class="cinta-estudio">Estudio Creativo</span>
            <span class="paso-etiqueta">Toma 01 · Conozcámonos</span>
            <h2 class="pregunta-titulo">¿Quién está detrás de esta idea?</h2>
            <p class="pregunta-subtitulo">Cuéntanos tu perfil para adaptar el lenguaje visual y narrativo de tu proyecto.</p>

            <div class="grid-opciones">
              ${perfiles.map(p => `
                <button type="button" class="opcion-btn ${respuestas.perfil === p.titulo ? 'activa' : ''}"
                  onclick="seleccionarPerfil('${p.titulo}')">
                  <span class="opcion-icono">${p.icono}</span>
                  <div class="opcion-contenido">
                    <span class="opcion-titulo">${p.titulo}</span>
                    <span class="opcion-desc">${p.desc}</span>
                  </div>
                </button>
              `).join("")}
            </div>

            <div class="navegacion-botones">
              <button type="button" class="btn-principal" ${!respuestas.perfil ? "disabled" : ""} onclick="irSiguiente()">
                Continuar →
              </button>
            </div>
          </section>
        `;
      }

      // ESCENA 2: SELECCIÓN MÚLTIPLE DE SERVICIOS
      else if (pasoActual === 1) {
        const seleccionados = obtenerObjetosServiciosSeleccionados();
        const subtotal = calcularTotalCotizacion();

        contenedor.innerHTML = `
          <section class="escena-card">
            <span class="cinta-estudio">Arma tu paquete</span>
            <span class="paso-etiqueta">Toma 02 · Selección múltiple</span>
            <h2 class="pregunta-titulo">¿Qué servicios quieres combinar?</h2>
            <p class="pregunta-subtitulo">Puedes elegir <strong>uno o varios servicios</strong> para armar la producción a tu medida.</p>

            <div class="grid-opciones">
              ${SERVICIOS_CATALOGO.map(s => {
                const estaActivo = respuestas.serviciosSeleccionados.includes(s.id);
                return `
                  <button type="button" class="opcion-btn ${estaActivo ? 'activa' : ''}"
                    onclick="alternarServicio('${s.id}')">
                    <span class="opcion-icono">${s.icono}</span>
                    <div class="opcion-contenido">
                      <span class="opcion-titulo">${s.titulo}</span>
                      <span class="opcion-desc">${s.descripcion}</span>
                      <div class="opcion-pie">
                        <span class="opcion-precio">${formatearCOP(s.precio)}</span>
                        <span class="check-pill">${estaActivo ? '✓ Agregado' : '+ Agregar'}</span>
                      </div>
                    </div>
                  </button>
                `;
              }).join("")}
            </div>

            <div class="barra-subtotal-servicios">
              <div class="subtotal-texto">
                <strong>${seleccionados.length} ${seleccionados.length === 1 ? 'servicio seleccionado' : 'servicios seleccionados'}</strong>
                <span>Suma estimada en tiempo real</span>
              </div>
              <span class="subtotal-monto">${formatearCOP(subtotal)}</span>
            </div>

            <div class="navegacion-botones">
              <button type="button" class="btn-secundario" onclick="irAnterior()">← Atrás</button>
              <button type="button" class="btn-principal" ${seleccionados.length === 0 ? "disabled" : ""} onclick="irSiguiente()">
                Continuar →
              </button>
            </div>
          </section>
        `;
      }

      // ESCENA 3: OBJETIVO AL ADQUIRIR EL SERVICIO
      else if (pasoActual === 2) {
        const objetivos = [
          {
            icono: "🔥",
            titulo: "Dar a conocer mi arte o lanzamiento",
            desc: "Impactar en redes sociales, plataformas digitales y nuevos públicos."
          },
          {
            icono: "📈",
            titulo: "Atraer clientes y fortalecer mi marca",
            desc: "Comunicar el valor humano y cultural detrás de mi emprendimiento."
          },
          {
            icono: "🎞️",
            titulo: "Registrar y vivir un evento inolvidable",
            desc: "Cubrir un festival, feria o encuentro cultural con calidad cinematográfica."
          },
          {
            icono: "💛",
            titulo: "Transformar y conectar con la comunidad",
            desc: "Visibilizar procesos sociales, identidad barranqueña y talento local."
          }
        ];

        contenedor.innerHTML = `
          <section class="escena-card">
            <span class="cinta-estudio">El Mensaje</span>
            <span class="paso-etiqueta">Toma 03 · El propósito</span>
            <h2 class="pregunta-titulo">¿Qué objetivo quieres lograr con esta producción?</h2>
            <p class="pregunta-subtitulo">Para nosotros cada plano comunica arte. Dinos qué quieres provocar en tu audiencia.</p>

            <div class="grid-opciones">
              ${objetivos.map(o => `
                <button type="button" class="opcion-btn ${respuestas.objetivo === o.titulo ? 'activa' : ''}"
                  onclick="seleccionarObjetivo('${o.titulo}')">
                  <span class="opcion-icono">${o.icono}</span>
                  <div class="opcion-contenido">
                    <span class="opcion-titulo">${o.titulo}</span>
                    <span class="opcion-desc">${o.desc}</span>
                  </div>
                </button>
              `).join("")}
            </div>

            <div class="navegacion-botones">
              <button type="button" class="btn-secundario" onclick="irAnterior()">← Atrás</button>
              <button type="button" class="btn-principal" ${!respuestas.objetivo ? "disabled" : ""} onclick="irSiguiente()">
                Continuar →
              </button>
            </div>
          </section>
        `;
      }

      // ESCENA 4: IDEA DE INSPIRACIÓN
      else if (pasoActual === 3) {
        const ideasRapidas = [
          "Estética collage urbano y color vibrante",
          "Documental ribereño al atardecer en Barranca",
          "Cámara dinámica juvenil para Reels / TikTok",
          "Iluminación cinematográfica con esencia cultural"
        ];

        contenedor.innerHTML = `
          <section class="escena-card">
            <span class="cinta-estudio">Dirección de Arte</span>
            <span class="paso-etiqueta">Toma 04 · Tu visión</span>
            <h2 class="pregunta-titulo">¿Qué idea o inspiración tienes en mente?</h2>
            <p class="pregunta-subtitulo">Cuéntanos una referencia visual, una emoción, una locación o combina estas vibras:</p>

            <textarea
              id="input-inspiracion"
              class="campo-textarea"
              placeholder="Ej. Queremos mezclar música en vivo, arte callejero y tomas aéreas del río Magdalena con colores cálidos y mucha energía..."
              oninput="actualizarInspiracion(this.value)"
            >${respuestas.inspiracion}</textarea>

            <div class="chips-sugerencias">
              ${ideasRapidas.map(idea => `
                <button type="button" class="chip" onclick="agregarChipInspiracion('${idea}')">+ ${idea}</button>
              `).join("")}
            </div>

            <div class="navegacion-botones">
              <button type="button" class="btn-secundario" onclick="irAnterior()">← Atrás</button>
              <button type="button" class="btn-principal" id="btn-next-insp" ${!respuestas.inspiracion.trim() ? "disabled" : ""} onclick="irSiguiente()">
                Continuar →
              </button>
            </div>
          </section>
        `;
      }

      // ESCENA 5: NOMBRE DEL PROYECTO O CLIENTE
      else if (pasoActual === 4) {
        contenedor.innerHTML = `
          <section class="escena-card">
            <span class="cinta-estudio">Créditos</span>
            <span class="paso-etiqueta">Toma 05 · Identidad</span>
            <h2 class="pregunta-titulo">¿Cómo se llama tu proyecto, empresa o agrupación?</h2>
            <p class="pregunta-subtitulo">Así sabremos cómo saludarte cuando recibamos tu solicitud en WhatsApp.</p>

            <input
              type="text"
              id="input-nombre"
              class="campo-input"
              placeholder="Ej. Colectivo Tambora / Café del Puerto / Sofía Gómez"
              value="${respuestas.nombreContacto}"
              oninput="actualizarNombre(this.value)"
            />

            <div class="navegacion-botones">
              <button type="button" class="btn-secundario" onclick="irAnterior()">← Atrás</button>
              <button type="button" class="btn-principal" id="btn-next-nombre" ${!respuestas.nombreContacto.trim() ? "disabled" : ""} onclick="irSiguiente()">
                Ver mi cotización →
              </button>
            </div>
          </section>
        `;
      }

      // ESCENA 6: RESUMEN CREATIVO, COTIZACIÓN Y CONFIRMACIÓN POR WHATSAPP
      else if (pasoActual === 5) {
        const seleccionados = obtenerObjetosServiciosSeleccionados();
        const totalGeneral = calcularTotalCotizacion();
        const urlWa = construirEnlaceWhatsApp();

        contenedor.innerHTML = `
          <section class="escena-card">
            <span class="cinta-estudio">¡Corte y Queda!</span>
            <span class="paso-etiqueta">Guion Final · Resumen de producción</span>
            <h2 class="pregunta-titulo">Tu propuesta está lista para rodar</h2>
            <p class="pregunta-subtitulo">Verifica las especificaciones de tu proyecto con <strong>Vamos Cultura</strong>:</p>

            <div class="ficha-resumen">
              <div class="ficha-fila">
                <span class="ficha-clave">Proyecto / Cliente:</span>
                <span class="ficha-valor">${escaparHTML(respuestas.nombreContacto)}</span>
              </div>
              <div class="ficha-fila">
                <span class="ficha-clave">Perfil:</span>
                <span class="ficha-valor">${escaparHTML(respuestas.perfil)}</span>
              </div>
              <div class="ficha-fila">
                <span class="ficha-clave">Servicios (${seleccionados.length}):</span>
                <div class="ficha-valor">
                  <ul class="lista-servicios-resumen">
                    ${seleccionados.map(s => `
                      <li>
                        • ${escaparHTML(s.titulo)}
                        <span class="tag-precio">${formatearCOP(s.precio)}</span>
                      </li>
                    `).join("")}
                  </ul>
                </div>
              </div>
              <div class="ficha-fila">
                <span class="ficha-clave">Objetivo:</span>
                <span class="ficha-valor">${escaparHTML(respuestas.objetivo)}</span>
              </div>
              <div class="ficha-fila">
                <span class="ficha-clave">Inspiración:</span>
                <span class="ficha-valor">«${escaparHTML(respuestas.inspiracion)}»</span>
              </div>
            </div>

            <div class="caja-total">
              <div>
                <span class="caja-total-label">Total paquete estimado</span>
                <span class="caja-total-sub">Pesos colombianos (COP)</span>
              </div>
              <span class="caja-total-precio">${formatearCOP(totalGeneral)}</span>
            </div>

            <a href="${urlWa}" target="_blank" rel="noopener noreferrer" class="btn-whatsapp" onclick="abrirWhatsApp(event)">
              <span>📲 Confirmar servicio por WhatsApp</span>
            </a>

            <div class="navegacion-botones" style="margin-top: 12px;">
              <button type="button" class="btn-secundario" style="width: 100%;" onclick="irAnterior()">
                ← Editar servicios o respuestas
              </button>
            </div>

            <p class="nota-privacidad">
              🔒 No guardamos tus datos ni pedimos pagos o contraseñas aquí.
            </p>
          </section>
        `;
      }
    }

    /* ==========================================================================
       5. MANEJADORES DE INTERACCIÓN Y NAVEGACIÓN
       ========================================================================== */
    function seleccionarPerfil(perfil) {
      respuestas.perfil = perfil;
      renderizarEscena();
    }

    // Permite seleccionar o quitar múltiples servicios al tocar cada tarjeta
    function alternarServicio(idServicio) {
      const indice = respuestas.serviciosSeleccionados.indexOf(idServicio);
      if (indice === -1) {
        respuestas.serviciosSeleccionados.push(idServicio);
      } else {
        respuestas.serviciosSeleccionados.splice(indice, 1);
      }
      renderizarEscena();
    }

    function seleccionarObjetivo(objetivo) {
      respuestas.objetivo = objetivo;
      renderizarEscena();
    }

    function actualizarInspiracion(texto) {
      respuestas.inspiracion = texto;
      const btn = document.getElementById("btn-next-insp");
      if (btn) btn.disabled = !texto.trim();
    }

    function agregarChipInspiracion(chipTexto) {
      const actual = respuestas.inspiracion.trim();
      respuestas.inspiracion = actual ? `${actual}. ${chipTexto}` : chipTexto;
      renderizarEscena();
    }

    function actualizarNombre(texto) {
      respuestas.nombreContacto = texto;
      const btn = document.getElementById("btn-next-nombre");
      if (btn) btn.disabled = !texto.trim();
    }

    function irSiguiente() {
      if (pasoActual < totalPasos - 1) {
        pasoActual++;
        renderizarEscena();
      }
    }

    function irAnterior() {
      if (pasoActual > 0) {
        pasoActual--;
        renderizarEscena();
      }
    }

    function escaparHTML(cadena) {
      const div = document.createElement("div");
      div.textContent = cadena;
      return div.innerHTML;
    }

    /* ==========================================================================
       6. GENERADOR DEL MENSAJE Y ENLACE OFICIAL DE WHATSAPP (+57 310 434 4957)
       ========================================================================== */
    function construirEnlaceWhatsApp() {
      const seleccionados = obtenerObjetosServiciosSeleccionados();
      if (seleccionados.length === 0) return `https://wa.me/${EMPRESA.whatsappNumero}`;

      const totalGeneral = calcularTotalCotizacion();
      const detalleServicios = seleccionados
        .map(s => `  • *${s.titulo}* (${formatearCOP(s.precio)}): ${s.descripcion}`)
        .join("\n");

      const mensaje = [
        `¡Hola *${EMPRESA.nombre}* 🪀! Quiero confirmar una cotización desde su web:`,
        ``,
        `🎬 *Proyecto / Cliente:* ${respuestas.nombreContacto.trim()}`,
        `🎭 *Tipo de cliente:* ${respuestas.perfil}`,
        `🎥 *Servicios seleccionados (${seleccionados.length}):*`,
        detalleServicios,
        `🎯 *Objetivo del proyecto:* ${respuestas.objetivo}`,
        `✨ *Idea / Inspiración:* ${respuestas.inspiracion.trim()}`,
        `💰 *Total estimado:* ${formatearCOP(totalGeneral)}`,
        `📍 *Ciudad:* ${EMPRESA.ciudad}`,
        ``,
        `Quedo atento(a) para coordinar nuestra producción.`
      ].join("\n");

      return `https://wa.me/${EMPRESA.whatsappNumero}?text=${encodeURIComponent(mensaje)}`;
    }

    function abrirWhatsApp(evento) {
      evento.preventDefault();
      const urlDestino = construirEnlaceWhatsApp();
      window.open(urlDestino, "_blank", "noopener,noreferrer");
    }

    // Iniciar la primera escena
    renderizarEscena();
  </script>
</body>
</html>
